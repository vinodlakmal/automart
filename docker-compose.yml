# Isolated stack for the classifieds app. Reads DB_* values from the project .env.
# Host PHP/Nginx/MySQL and other sites are untouched. Site served on host port 8080.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: automart-app
    container_name: automart-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - automart

  web:
    image: nginx:1.27-alpine
    container_name: automart-web
    restart: unless-stopped
    ports:
      - "8090:80"            # http://173.249.28.120:8080  (change left number to use another host port)
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - automart

  db:
    image: mysql:8.0
    container_name: automart-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-ikman}"
      MYSQL_USER: "${DB_USERNAME:-ikman}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootsecret}"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No host port published -> DB reachable only by the app container (isolated).
    networks:
      - automart

volumes:
  db-data:

networks:
  automart:
    driver: bridge

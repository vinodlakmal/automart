# /etc/nginx/sites-available/ikman-clone
# Serve the Laravel app. Replace 173.249.28.120 (or set a domain) in server_name.
server {
    listen 80;
    listen [::]:80;
    server_name 173.249.28.120;

    root /var/www/ikman-clone/public;
    index index.php;

    charset utf-8;
    client_max_body_size 50M;   # allow up to 8 images @ 5MB

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
